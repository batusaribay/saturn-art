[package]
name = "saturn-art"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A Rust CLI that renders a live, ray-traced Saturn"
license = "MIT"
repository = "https://github.com/batusaribay/saturn-art"
homepage = "https://github.com/batusaribay/saturn-art"
readme = "README.md"
keywords = ["saturn", "ascii-art", "terminal", "space", "raytracer"]
categories = ["command-line-utilities", "graphics"]

[[bin]]
name = "saturn-art"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
