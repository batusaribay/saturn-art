[package]
name = "saturn-art"
version = "0.1.0"
edition = "2021"
description = "A live, realistic Saturn spinning in colored ASCII art"
license = "MIT"

[[bin]]
name = "saturn-art"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
